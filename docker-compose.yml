# mboss/docker-compose.yml — cloud stack, local dev  [runs the licensing product only]
#
# Postgres only for now. The api / dbos / web services join once every one of those repos
# has the dev Dockerfile compose builds from — the api has one, the other two do not yet.
services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_DB: mboss, POSTGRES_USER: postgres, POSTGRES_PASSWORD: mboss }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mboss"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
