# mboss/docker-compose.yml — the cloud
# stack, local dev.
#
# Each app service reads its environment from
# its own submodule's env file:
#
#   web   ← mboss-web/.env.local
#   api   ← mboss-nodejs-api/.env
#   dbos  ← mboss-nodejs-dbos/.env
#
# Each has a committed .env.example beside it
# to copy. Populate all three before bringing
# the stack up, or web/api/dbos fail at their
# own startup validation, which names the exact
# variables it wanted. `docker compose up -d
# postgres` still works on a bare checkout,
# which is what the `npx prisma migrate dev`
# workflow in mboss-database needs — that is
# why the env files are `required: false`
# rather than `required: true`, since a missing
# required file fails the whole project at
# config time, postgres included.
#
# The environment: blocks below carry only
# facts about the Docker network, which no
# submodule file can know. Each of those files
# names `localhost` for the database and for
# the api, which is right when that service
# runs on the host and wrong in here, so these
# blocks replace exactly those keys with the
# compose hostnames. Nothing portable belongs
# here: environment: always beats env_file:, so
# a value set in both places is a value the
# submodule file can no longer change. SITE_URL
# is the single deliberate exception, explained
# where it is set.
#
# web is the only service published to the
# network. Postgres is published on the
# loopback alone, so the `npx prisma migrate
# dev` workflow in mboss-database still
# reaches it while a laptop on a shared wifi
# does not hand every Subscriber row to
# anyone who has read the password below. The
# api and the worker publish nothing at all,
# which is this stack's stand-in for the
# production topology — web is the one
# publicly routable service, and the API is
# reachable only from it.
#
# Two things about running this locally that
# are not obvious:
#
#   1. Confirmation email needs a real
#      SENDGRID_API_KEY in
#      mboss-nodejs-dbos/.env. There is no mail
#      sink here, so the worker's send step
#      reaches the real SendGrid with whatever
#      key it is given, and that file's
#      placeholder gets a 401.
#
#   2. That failure is permanent for the
#      address. A DBOS step error is
#      checkpointed and terminal, and a
#      confirmation workflow's id derives from
#      a 24-hour send key — so a second signup
#      from the same address inside that
#      window attaches to the already-failed
#      workflow instead of starting a new one.
#      Set a real key before signing up an
#      address you care about, and use a fresh
#      address per run.
services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_DB: mboss, POSTGRES_USER: postgres, POSTGRES_PASSWORD: mboss }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mboss"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The worker starts before the api, because
  # DBOS creates its system schema at launch
  # and the api's DBOSClient answers 500
  # enqueueing into a schema that does not
  # exist yet. `service_started` is the
  # strongest condition available: the worker
  # binds no port and serves no routes, so
  # there is nothing to poll. That leaves a
  # few seconds after `up` in which a signup
  # can fail to enqueue, which a dev stack can
  # live with and the e2e harness cannot.
  dbos:
    build: ./mboss-nodejs-dbos
    depends_on:
      postgres: { condition: service_healthy }
    # The whole file flows in rather than a
    # chosen subset — re-listing keys here to
    # filter it would rebuild the duplication
    # this arrangement removes. So
    # SENDGRID_BASE_URL and MAIL_FROM arrive at
    # the same values the worker's own schema
    # already defaults to, DBOS_TEST_DATABASE_URL
    # arrives and is read by nothing this
    # container runs, and TWILIO_API_KEY /
    # TWILIO_API_SECRET arrive ahead of the code
    # that will read them. None of the four
    # change what the worker does.
    env_file:
      - path: ./mboss-nodejs-dbos/.env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:mboss@postgres:5432/mboss
      API_BASE_URL: http://api:3001
      # The one deliberate exception to "the
      # submodule's file is authoritative", and
      # it lives here because it is a fact about
      # where this stack answers rather than
      # about the worker. Every manage and
      # unsubscribe link in every outgoing email
      # is minted against this origin, so locally
      # it has to name the published web port.
      # mboss-nodejs-dbos/.env holds the
      # production origin — correct for a worker
      # run on the host, and a link nobody here
      # could click.
      SITE_URL: ${SITE_URL:-http://localhost:3000}

  api:
    build: ./mboss-nodejs-api
    depends_on:
      postgres: { condition: service_healthy }
      dbos: { condition: service_started }
    # PORT also arrives from the file, at the
    # same 3001 the api's own schema defaults to.
    env_file:
      - path: ./mboss-nodejs-api/.env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:mboss@postgres:5432/mboss
      DBOS_SYSTEM_DATABASE_URL: postgres://postgres:mboss@postgres:5432/mboss
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./mboss-web
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]
    env_file:
      - path: ./mboss-web/.env.local
        required: false
    # Next.js telemetry is off, but not from
    # here: mboss-web/Dockerfile sets
    # NEXT_TELEMETRY_DISABLED image-wide, which
    # reaches every process the container runs.
    # It is policy, not configuration, so it has
    # one home rather than two to keep in sync.
    environment:
      API_BASE_URL: http://api:3001
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
